---
- name: Ensure enable-linger is active
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ traefik_user }}"
  args:
    creates: "/var/lib/systemd/linger/{{ traefik_user }}"

- name: Deploy Quadlet .container files
  ansible.builtin.template:
    src: traefik.container.j2
    dest: "/home/{{ traefik_user }}/.config/containers/systemd/{{ traefik_container_name }}.container"
    owner: "{{ traefik_user }}"
    group: "{{ traefik_user }}"
    mode: '0644'
  register: container_template_result

- name: Reload systemd user daemon
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  become: true
  become_user: "{{ traefik_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_user_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ traefik_user_uid.stdout }}/bus"
  when: container_template_result.changed
