---
- name: Ensure pod service is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ traefik_container_name }}.service"
    state: started
    enabled: true
    scope: user
  become: true
  become_user: "{{ traefik_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ traefik_user_uid.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ traefik_user_uid.stdout }}/bus"
